name: Fork release

# Tag the fork like v6.2.0-fork.1. Upstream's own v* tags (fetched when merging) never match.
on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm for web/, yarn for the email builder.
      - run: corepack enable

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --parallelism 1 --clean --config .goreleaser.fork.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
          # Shown as the "Source code" link in the admin (AGPL §13).
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
