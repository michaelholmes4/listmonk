name: Build Sanity Check

on:
    pull_request:
      types:
        - opened
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      # fork: the UI (web/, pnpm) and the email builder (yarn) are built by make dist.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Prepare Dependencies and Build
        run: make dist
