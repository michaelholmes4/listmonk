services:
  app:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/go/pkg/mod
    environment:
      CGO_ENABLED: "0"
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: listmonk-dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: listmonk-dev
      POSTGRES_PASSWORD: listmonk-dev
      POSTGRES_DB: listmonk-dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk-dev -d listmonk-dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

volumes:
  db-data:
  go-mod-cache:
